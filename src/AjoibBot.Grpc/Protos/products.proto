syntax = "proto3";
option csharp_namespace = "AjoibBot.Grpc";
package products;

service ProductService {
  rpc GetAll (GetAllRequest) returns (ProductList);
  rpc GetById (GetByIdRequest) returns (ProductResponse);
}

message GetAllRequest {
  // пустой запрос — параметры не нужны
}

message GetByIdRequest {
  int32 id = 1;
}

message ProductResponse {
  int32 id = 1;
  string name = 2;
  double price = 3;
  string size = 4;
  string color = 5;
  int32 stock_quantity = 6;
  string category_name = 7;
}

message ProductList {
  repeated ProductResponse products = 1;
}